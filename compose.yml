# Expects a git clone of the Crimson repo at ./Crimson, containing src/,
# data/, utils/, authentication_crawling/, etc. -- with recv.py, send.py,
# listen.py, and validate.py inside Crimson/src/ replaced by the rewritten
# versions (env-configurable hosts instead of hardcoded IPs / localhost).
#
# Uses network_mode: host so "localhost" inside every container resolves to
# this same machine, matching CRIMSON_HOST / RABBITMQ_HOST / etc. defaulting
# to "localhost". This ONLY works on native Linux Docker Engine -- Docker
# Desktop (Mac/Windows) does not support host networking the same way.

x-crimson-build: &crimson-build
  build:
    context: ./Crimson
    dockerfile_inline: |
      FROM python:3.11-slim
      RUN apt-get update && apt-get install -y --no-install-recommends \
            tesseract-ocr rsync openssh-client gcc \
            chromium chromium-driver && \
          rm -rf /var/lib/apt/lists/*
      WORKDIR /app
      ENV PYTHONPATH=/app
      COPY requirements.txt .
      RUN pip install --no-cache-dir -r requirements.txt
      COPY . .
  image: crimson-python-env:latest

# Same image as wallet_browser's Dockerfile (vendored at
# Crimson/vendor/wallet_browser): Scrapling's stealth session on patchright's
# bundled Chromium, plus the Claude Code CLI that wallet_browser shells out
# to. Separate from x-crimson-build since it needs Python >= 3.12.
x-crimson-crawler-build: &crimson-crawler-build
  build:
    context: ./Crimson
    dockerfile_inline: |
      FROM python:3.12-slim
      RUN apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && \
          rm -rf /var/lib/apt/lists/*
      # Claude Code CLI (native installer, no Node needed)
      RUN curl -fsSL https://claude.ai/install.sh | bash
      ENV PATH="/root/.local/bin:$${PATH}"
      WORKDIR /app
      ENV PYTHONPATH=/app
      COPY vendor/wallet_browser ./vendor/wallet_browser
      COPY requirements-crawler.txt .
      RUN pip install --no-cache-dir ./vendor/wallet_browser -r requirements-crawler.txt && \
          python -m patchright install --with-deps chromium
      COPY . .
  image: crimson-crawler-env:latest

services:
  rabbitmq:
    image: rabbitmq:4.3.2-management
    container_name: rabbitmq
    network_mode: host
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  certstream-server:
    image: ghcr.io/reloading01/certstream-server-rust:1.5.2
    container_name: certstream-server
    network_mode: host

  crimson-listener:
    <<: *crimson-build
    container_name: crimson-listener
    network_mode: host
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      certstream-server:
        condition: service_started
    command: python src/listen.py
    restart: unless-stopped

  crimson-sender:
    <<: *crimson-build
    container_name: crimson-sender
    network_mode: host
    env_file: .env
    depends_on:
      crimson-listener:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    command: python src/send.py
    restart: unless-stopped

  # Second instance so RabbitMQ round-robins "urls" across two consumers --
  # single-instance throughput (~627/s) couldn't keep up with certstream's
  # intake rate (~1300/s). Duplicate further (crimson-sender-3, ...) if the
  # backlog still doesn't stabilize.
  crimson-sender-2:
    <<: *crimson-build
    container_name: crimson-sender-2
    network_mode: host
    env_file: .env
    depends_on:
      crimson-listener:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    command: python src/send.py
    restart: unless-stopped

  # One service per worker so each gets a distinct SYSNO/SCREENNO.
  # Duplicate this block (crimson-recv-3, -4, ...) to scale out.
  crimson-recv-1:
    <<: *crimson-build
    container_name: crimson-recv-1
    network_mode: host
    env_file: .env
    # Bind mounts instead of named volumes -- these land as real files at
    # ./data/recv1, ./logs/recv1, ./results/recv1 next to compose.yml,
    # visible directly on the host instead of hidden inside Docker's own
    # volume storage.
    volumes:
      - ./data/recv1:/app/data
      - ./logs/recv1:/app/logs
      - ./results/recv1:/app/results
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: python src/recv.py 1 1
    restart: unless-stopped

  crimson-recv-2:
    <<: *crimson-build
    container_name: crimson-recv-2
    network_mode: host
    env_file: .env
    volumes:
      - ./data/recv2:/app/data
      - ./logs/recv2:/app/logs
      - ./results/recv2:/app/results
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: python src/recv.py 2 1
    restart: unless-stopped

  crimson-recv-3:
    <<: *crimson-build
    container_name: crimson-recv-3
    network_mode: host
    env_file: .env
    volumes:
      - ./data/recv3:/app/data
      - ./logs/recv3:/app/logs
      - ./results/recv3:/app/results
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: python src/recv.py 3 1
    restart: unless-stopped

  crimson-recv-4:
    <<: *crimson-build
    container_name: crimson-recv-4
    network_mode: host
    env_file: .env
    volumes:
      - ./data/recv4:/app/data
      - ./logs/recv4:/app/logs
      - ./results/recv4:/app/results
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: python src/recv.py 4 1
    restart: unless-stopped

  crimson-recv-5:
    <<: *crimson-build
    container_name: crimson-recv-5
    network_mode: host
    env_file: .env
    volumes:
      - ./data/recv5:/app/data
      - ./logs/recv5:/app/logs
      - ./results/recv5:/app/results
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: python src/recv.py 5 1
    restart: unless-stopped

  crimson-recv-6:
    <<: *crimson-build
    container_name: crimson-recv-6
    network_mode: host
    env_file: .env
    volumes:
      - ./data/recv6:/app/data
      - ./logs/recv6:/app/logs
      - ./results/recv6:/app/results
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: python src/recv.py 6 1
    restart: unless-stopped

  crimson-validate:
    <<: *crimson-build
    container_name: crimson-validate
    network_mode: host
    env_file: .env
    volumes:
      - ./results/validate:/app/results
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: python src/validate.py
    restart: unless-stopped

  crimson-crawler:
    <<: *crimson-crawler-build
    container_name: crimson-crawler
    # Deliberately NOT network_mode: host, unlike every other service.
    # This is the one container that actively interacts with malicious
    # sites (clicking, form-filling, following links) rather than just
    # fetching them -- worth the isolation cost of a normal bridge network.
    # extra_hosts lets it reach RABBITMQ_HOST=host.docker.internal, which
    # resolves to the host machine (where rabbitmq's host-networked port
    # is actually listening) on both Docker Desktop and Linux (20.10+).
    # The browser itself can't reach host.docker.internal: wallet_browser's
    # scope guard blocks localhost/private addresses for every page request.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RABBITMQ_HOST: host.docker.internal
    # Same lockdown as wallet_browser's run.sh. Chromium's own sandbox is off
    # in containers (wallet_browser detects /.dockerenv), so this is the
    # isolation layer. Needs CLAUDE_CODE_OAUTH_TOKEN in .env.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: .env
    volumes:
      - ./results/crawler:/app/results
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: python src/crawler.py
    restart: unless-stopped
